# This is a basic workflow to help you get started with Actions

name: Deploy to GH Pages

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm install
      - name: Install build tool
        run: npm install @yao-pkg/pkg
      - name: Build
        run: npm run build
      - name: Upload static files as artifact
        id: deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/

      - name: Install ldid to sign mac binary
        uses: MOZGIII/install-ldid-action@v1
        with:
          tag: v2.1.5-procursus7
      - name: Build pkg binaries
        run: cd exporter && sh build-pkg.sh && cd ..
      - name: Read version and name from package.json
        id: pkgjson
        run: |
          VERSION=$(node -e "console.info('ascii2retro Exporter', require('./package.json').version)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  deploy:
    needs: build

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
      contents: write # To write releases

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Specify runner + deployment step
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Upload Exporter Binary Releas
        automatic_release_tag: ${{ steps.pkgjson.outputs.version }}
        uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: false
          title: ${{ steps.pkgjson.outputs.version }}
          files: |
            /home/runner/work/ascii2retro/ascii2retro/exporter/bin/*
